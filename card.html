<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Running List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600&display=swap');

:root {
  --paper: #ede8db;
  --paper-line: #d8d1bd;
  --ink: #23291f;
  --ink-soft: #5c6152;
  --accent: #2f5d4f;
  --accent-soft: #6f8f83;
  --strike: #a99b7a;
  --card-shadow: rgba(35, 41, 31, 0.18);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #c9c2ac;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,0.06), transparent 45%);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 20px;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}

.card {
  width: 100%;
  max-width: 420px;
  background: var(--paper);
  background-image: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 35px,
    var(--paper-line) 36px
  );
  box-shadow: 0 18px 40px var(--card-shadow), 0 2px 0 rgba(255,255,255,0.4) inset;
  padding: 36px 32px 28px;
  position: relative;
  transform: rotate(-0.4deg);
}

.card::before {
  content: "";
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%) rotate(2deg);
  width: 70px; height: 22px;
  background: rgba(255, 244, 200, 0.55);
  border: 1px solid rgba(0,0,0,0.05);
}

header {
  margin-bottom: 22px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}

h1 {
  font-family: 'Special Elite', monospace;
  font-size: 26px;
  margin: 0 0 4px;
  letter-spacing: 0.5px;
}

.subhead {
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
}

form {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

input[type="text"] {
  flex: 1;
  border: none;
  border-bottom: 1.5px solid var(--ink);
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  padding: 6px 2px;
  color: var(--ink);
  outline: none;
}

input[type="text"]::placeholder {
  color: var(--ink-soft);
}

input[type="text"]:focus {
  border-bottom-color: var(--accent);
}

button.add {
  background: var(--accent);
  color: var(--paper);
  border: none;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 14px;
  padding: 0 16px;
  cursor: pointer;
  transition: background 0.15s ease;
}

button.add:hover { background: #244a3f; }
button.add:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  line-height: 20px;
}

.check {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border: 1.5px solid var(--ink);
  background: transparent;
  cursor: pointer;
  position: relative;
  padding: 0;
}

.check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.check.done {
  background: var(--accent);
  border-color: var(--accent);
}

.check.done::after {
  content: "";
  position: absolute;
  left: 4px; top: 0px;
  width: 5px; height: 9px;
  border-right: 2px solid var(--paper);
  border-bottom: 2px solid var(--paper);
  transform: rotate(40deg);
}

.text {
  flex: 1;
  font-size: 15px;
  word-break: break-word;
}

.text.done {
  color: var(--strike);
  text-decoration: line-through;
  text-decoration-color: var(--strike);
}

.remove {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--ink-soft);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px;
  opacity: 0;
  transition: opacity 0.15s ease;
}

li:hover .remove, li:focus-within .remove { opacity: 1; }
.remove:hover { color: #a4382f; }
.remove:focus-visible { outline: 2px solid var(--ink); opacity: 1; }

.empty {
  color: var(--ink-soft);
  font-size: 14px;
  font-style: italic;
  padding: 12px 0;
}

footer {
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--paper-line);
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
}

.clear-done {
  background: none;
  border: none;
  color: var(--accent-soft);
  font-size: 12px;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}
.clear-done:hover { color: var(--accent); }
.clear-done:disabled { color: var(--paper-line); text-decoration: none; cursor: default; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
  </style>
</head>
<body>

  <div class="card">
    <header>
      <h1>Running List</h1>
      <div class="subhead">
        <span id="dateLabel"></span>
        <span id="countLabel">0 open</span>
      </div>
    </header>

    <form id="addForm">
      <input type="text" id="itemInput" placeholder="Add something to track…" autocomplete="off" maxlength="140">
      <button type="submit" class="add">Add</button>
    </form>

    <ul id="list"></ul>
    <div class="empty" id="emptyMsg">Nothing on the list yet.</div>

    <footer>
      <span id="doneLabel">0 crossed off</span>
      <button class="clear-done" id="clearDone">Clear crossed off</button>
    </footer>
  </div>

  <script src="card.js"></script>
</body>
</html>
